      claim: Official docs declare L1 execution split into HyperCore and HyperEVM.
      epistemology: DECLARED_ONLY
      evidence_status: PRIMARY_LOCATED
      locator: https://hyperliquid.gitbook.io/hyperliquid-docs/about-hyperliquid.md
      source_ids:
      - S-ABOUT
      falsifier: Official docs retract the HyperCore/HyperEVM split.
      limitations: Declaration in captured markdown, not a code audit.
      capture_sha256: 8a8b73dac2d3939aa1f4e126c4b36bd3efde2a5d28d97dfe72a2ddca6297a01f
    - finding_id: HYPE-F-002
