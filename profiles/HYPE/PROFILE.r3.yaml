unknowns:
- unknown_id: HYPE-U-001
  layer: audits
  question: Does any published audit cover running HyperCore matching bytecode?
  why_material: Bridge audit is not core-execution audit.
  what_would_close_it: Audit PDF + bytecode hash.
- unknown_id: HYPE-U-002
  layer: revenue_to_token
  question: Is there an un-switchable route from protocol revenue to HYPE holders?
  why_material: Fee schedule ≠ holder entitlement.
  what_would_close_it: Rule/code without admin off-switch.
- unknown_id: HYPE-U-003
  layer: treasury_custody_bridges_keys
  question: HLP / treasury / bridge signer sets?
  why_material: HLP role is declared; keys are not.
  what_would_close_it: Address registry + threshold.
- unknown_id: HYPE-U-004
  layer: validators_sequencers_nodes_oracles
  question: Which validators are Foundation-affiliated?
  why_material: API gives names and stake, not control graph.
  what_would_close_it: Identity map.
- unknown_id: HYPE-U-005
  layer: tokenomics
  question: Free float / unlocks / insider inventory on as_of?
  why_material: Staking threshold is not circulating supply.
  what_would_close_it: Date-aligned snapshot.
- unknown_id: HYPE-U-006
  layer: jurisdiction_legal
  question: Full legal map of Labs / Foundation / HPC?
  why_material: Contributors page names Labs, not a registry.
  what_would_close_it: Primary filings.
- unknown_id: HYPE-U-007
  layer: smart_contracts
  question: Is HyperCore matching source public and reproducible?
  why_material: Docs describe behaviour; they are not the binary.
  what_would_close_it: Public tree + build hash.
- unknown_id: HYPE-U-008
  layer: governance
  question: Can HYPE holders change HyperCore parameters without the validator path?
  why_material: Quorum and jail are validator-set mechanics.
  what_would_close_it: Observed proposal → executed change without that path.
