unknowns:
- unknown_id: AAVE-U-001
  layer: audits
  question: Which running deployment commit equals which audit PDF?
  why_material: A folder of PDF names is not a bytecode match.
  what_would_close_it: Commit hash ↔ deployed bytecode ↔ PDF scope.
- unknown_id: AAVE-U-002
  layer: revenue_to_token
  question: Is there an un-switchable route from protocol revenue / GHO residual to
    AAVE holders?
  why_material: Governance token ≠ cashflow claim.
  what_would_close_it: Rule without admin off-switch plus flow.
- unknown_id: AAVE-U-003
  layer: treasury_custody_bridges_keys
  question: Collector / treasury / guardian / Finance Committee signer sets?
  why_material: Umbrella names a committee; keys are missing.
  what_would_close_it: Address registry + threshold.
- unknown_id: AAVE-U-004
  layer: tokenomics
  question: Circulating, locked, stkAAVE share, treasury inventory on as_of?
  why_material: Token role is not free float.
  what_would_close_it: Date-aligned snapshot.
- unknown_id: AAVE-U-005
  layer: jurisdiction_legal
  question: Legal entities behind Aave Labs / BGD Labs / DAO and licences?
  why_material: Docs name Labs; they are not filings.
  what_would_close_it: Primary filings.
- unknown_id: AAVE-U-006
  layer: founders_management_entities
  question: Beneficial control of Aave Labs and BGD Labs?
  why_material: Interface operator ≠ owner graph.
  what_would_close_it: official_cross_link or independent confirmation.
- unknown_id: AAVE-U-007
  layer: validators_sequencers_nodes_oracles
  question: Oracle operator set and fallback per reserve on as_of?
  why_material: Docs say an oracle exists; not who can change the source.
  what_would_close_it: Source registry + admin.
